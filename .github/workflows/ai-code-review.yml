# PR이 열리거나 새 커밋이 올라오면 변경 내용(diff)을 Gemini에 보내 코드 리뷰를 받고,
# 그 결과를 PR 댓글로 남긴다. 같은 PR에서는 댓글 하나를 계속 갱신한다.
#
# 필요한 설정
# - Secrets  : GEMINI_API_KEY (필수)
# - Variables: GEMINI_MODEL   (선택, 비우면 gemini-2.5-flash)
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# 같은 PR에 커밋이 연달아 올라오면 이전 리뷰는 취소하고 최신 것만 돌린다.
concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PR은 건너뛴다. 포크에서 온 PR은 시크릿을 쓸 수 없어 건너뛴다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Gemini에 보낼 diff 최대 길이(문자). 넘으면 잘라서 보낸다.
      MAX_DIFF_CHARS: "150000"
      COMMENT_MARKER: "<!-- ai-code-review -->"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect diff
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          # 잠금 파일, 빌드 결과물, 이미지 등 리뷰할 필요가 없는 파일은 제외
          git diff --no-color "$BASE_SHA"..."$HEAD_SHA" -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)yarn.lock' \
            ':(exclude)*.min.js' \
            ':(exclude)*.svg' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.ico' \
            > full.diff

          if [ ! -s full.diff ]; then
            echo "리뷰할 변경 사항이 없습니다."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          head -c "$MAX_DIFF_CHARS" full.diff > pr.diff
          if [ "$(wc -c < full.diff)" -gt "$MAX_DIFF_CHARS" ]; then
            echo "TRUNCATED=true" >> "$GITHUB_ENV"
          fi

          git diff --stat "$BASE_SHA"..."$HEAD_SHA" > stat.txt

      - name: Request review from Gemini
        if: env.SKIP != 'true'
        run: |
          cat > prompt.txt <<'EOF'
          당신은 이 저장소의 시니어 프론트엔드 리뷰어입니다. 아래 Pull Request의 diff를 리뷰하세요.

          프로젝트 정보
          - Next.js 16 (App Router) + React 19 + TypeScript + Tailwind CSS v4
          - Next.js 16에는 이전 버전과 다른 API가 있습니다. 예: 미들웨어 파일 이름이 middleware.ts가 아니라 proxy.ts입니다.
            확실하지 않은 Next.js API 지적은 하지 마세요.
          - 백엔드 REST API(/api/v1)와 연동하며, NEXT_PUBLIC_USE_MOCK=true면 목데이터로 동작합니다.

          리뷰 기준 (중요한 순서)
          1. 버그: 잘못된 로직, 예외 처리 누락, 경쟁 상태, React 훅 규칙 위반, 메모리 누수
          2. 보안: 비밀 값 노출, XSS, 인증 처리 문제
          3. 타입 안정성: any 남용, 잘못된 타입 단언
          4. 성능: 불필요한 리렌더링, 과도한 요청
          5. 가독성/유지보수: 중복 코드, 이해하기 어려운 이름

          작성 규칙
          - 한국어로 작성하세요.
          - 확신이 있는 지적만 하고, 코드 스타일 취향이나 사소한 포맷팅은 언급하지 마세요.
          - 각 지적에는 `파일경로:줄번호`, 문제 설명, 수정 예시 코드를 포함하세요.
          - 문제가 없으면 억지로 만들지 말고 "특별한 문제를 찾지 못했습니다"라고 쓰세요.

          출력 형식 (Markdown)
          ## 요약
          (이 PR이 하는 일 2~3줄)

          ## 주요 이슈
          (🔴 반드시 수정 / 🟡 수정 권장 으로 구분해서 나열. 없으면 "없음")

          ## 개선 제안
          (선택 사항. 없으면 생략)
          EOF

          {
            cat prompt.txt
            printf '\n\n---\nPR 제목: %s\n\nPR 설명:\n%s\n\n변경 파일:\n' "$PR_TITLE" "$PR_BODY"
            cat stat.txt
            printf '\n\nDiff:\n```diff\n'
            cat pr.diff
            printf '\n```\n'
          } > input.txt

          jq -n --rawfile text input.txt '{
            contents: [{ role: "user", parts: [{ text: $text }] }],
            generationConfig: { temperature: 0.2 }
          }' > request.json

          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            --data-binary @request.json)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Gemini API 요청 실패 (HTTP $HTTP_CODE): $(jq -r '.error.message // "알 수 없는 오류"' response.json)"
            exit 1
          fi

          jq -r '[.candidates[0].content.parts[]?.text] | join("")' response.json > review.md

          if [ ! -s review.md ]; then
            echo "::error::Gemini 응답에 리뷰 내용이 없습니다. (finishReason: $(jq -r '.candidates[0].finishReason // "없음"' response.json))"
            exit 1
          fi

      - name: Post review comment
        if: env.SKIP != 'true'
        run: |
          {
            echo "$COMMENT_MARKER"
            echo "# 🤖 AI 코드 리뷰"
            echo
            cat review.md
            echo
            echo "---"
            if [ "$TRUNCATED" = "true" ]; then
              echo "> ⚠️ 변경 내용이 커서 diff 앞부분 ${MAX_DIFF_CHARS}자만 리뷰했습니다."
              echo
            fi
            echo "<sub>${GEMINI_MODEL} · 커밋 ${HEAD_SHA:0:7} 기준 · AI 리뷰이므로 참고용으로 봐주세요.</sub>"
          } > comment.md

          # 이전에 남긴 AI 리뷰 댓글이 있으면 갱신, 없으면 새로 작성
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@comment.md > /dev/null
            echo "기존 리뷰 댓글을 갱신했습니다."
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
            echo "리뷰 댓글을 작성했습니다."
          fi

          cat comment.md >> "$GITHUB_STEP_SUMMARY"
